<ul class="socials" [class.socials--labels]="withLabels()" role="list">
  @for (link of links(); track link.url) {
    <li>
      <a
        class="socials__link"
        [href]="link.url"
        [attr.target]="link.kind === 'email' ? null : '_blank'"
        [attr.rel]="link.kind === 'email' ? null : 'noopener me'"
        [attr.aria-label]="withLabels() ? null : (link.label | l10n)"
      >
        <app-icon [name]="icons[link.kind]" />
        @if (withLabels()) {
          <span>{{ link.label | l10n }}</span>
        }
      </a>
    </li>
  }
</ul>
